name: Build and Deploy

permissions:
  pull-requests: write

on:
  pull_request:
    branches:
      - "*-release/**"
      - "master"

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup and Build
        uses: ./.github/actions/build
        with:
          node-version: 24

      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          deploy-path: pr/${{ github.event.pull_request.number }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-default-region: ${{ vars.AWS_REGION }}
          s3-bucket: ${{ secrets.S3_BUCKET }}
          s3-endpoint: ${{ vars.S3_ENDPOINT }}

      - name: Find preview comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- theme-preview-url -->"

      - name: Comment preview URL
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- theme-preview-url -->
            You can access the files at: ${{ vars.S3_ENDPOINT }}/${{ secrets.S3_BUCKET }}/pr/${{ github.event.pull_request.number }}
